<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSL 2026 - Simulador Pro Avançado</title>
    <style>
        :root {
            --wsl-bg: #f8fafc;
            --wsl-card-bg: #ffffff;
            --wsl-card-hover: #f1f5f9;
            --wsl-border: #cbd5e1;
            --wsl-border-light: #e2e8f0;
            --wsl-accent: #0284c7;
            --wsl-green: #10b981;
            --wsl-gold: #facc15;
            --wsl-red: #ef4444;
            --wsl-text-dark: #0f172a;
            --wsl-text-muted: #64748b;
            --wsl-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --line-color: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--wsl-font); }
        body { height: 100vh; overflow: hidden; background: var(--wsl-bg); color: var(--wsl-text-dark); display: flex; flex-direction: column; }

        .wsl-header { background: #0c1017; color: #fff; padding: 0 16px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
        .wsl-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
        .wsl-logo { background: var(--wsl-accent); padding: 2px 6px; border-radius: 4px; }

        .wsl-subnav { background: #fff; border-bottom: 1px solid var(--wsl-border-light); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .controls-group, .actions-group { display: flex; align-items: center; gap: 8px; }
        select { background: #f8fafc; border: 1px solid var(--wsl-border); padding: 5px 8px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; }
        
        .category-tabs { display: flex; background: #e2e8f0; padding: 2px; border-radius: 5px; }
        .tab-btn { background: transparent; color: var(--wsl-text-muted); border: none; padding: 5px 12px; border-radius: 3px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: var(--wsl-accent); color: #fff; }

        .btn-sync { background: rgba(2, 132, 199, 0.1); color: var(--wsl-accent); border: 1px solid rgba(2, 132, 199, 0.3); padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
        .btn-reset { background: rgba(239, 68, 68, 0.1); color: var(--wsl-red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }

        .event-details { padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--wsl-border-light); }
        .event-details h2 { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; }
        .event-details p { font-size: 0.72rem; color: var(--wsl-text-muted); }

        .bracket-outer-wrapper { flex: 1; overflow: auto; padding: 40px 24px; position: relative; }
        .bracket-viewport { display: flex; gap: 40px; margin: 0 auto; width: fit-content; align-items: stretch; position: relative; }

        #svg-lines-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .side-bracket { display: flex; gap: 40px; }
        .center-bracket { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 220px; }
        .round-column { width: 200px; display: flex; flex-direction: column; }
        
        .round-header { text-align: center; font-size: 0.7rem; font-weight: 800; color: var(--wsl-text-muted); text-transform: uppercase; padding: 4px; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px; }

        .heats-container { display: grid; grid-template-rows: repeat(8, 1fr); flex: 1; }
        .heat-node { display: flex; align-items: center; justify-content: center; width: 100%; }
        .heat-card-wrapper { width: 100%; padding: 4px 0; }

        .heat-card { background: var(--wsl-card-bg); border: 1px solid var(--wsl-border-light); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .heat-title { background: #f1f5f9; font-size: 0.65rem; font-weight: 800; color: var(--wsl-text-muted); padding: 4px 8px; display: flex; justify-content: space-between; }
        
        .surfer-slot { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid var(--wsl-border-light); cursor: pointer; }
        .surfer-slot:last-child { border-bottom: none; }
        .surfer-slot.winner { background: rgba(16, 185, 129, 0.08); border-left: 3px solid var(--wsl-green); }
        .surfer-name { font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <header class="wsl-header">
        <div class="wsl-brand"><span class="wsl-logo">WSL</span> CT 2026 Simulator</div>
    </header>

    <nav class="wsl-subnav">
        <div class="controls-group">
            <select id="eventSelect"></select>
            <div class="category-tabs">
                <button class="tab-btn active" id="btnMasc">Masc</button>
                <button class="tab-btn" id="btnFem">Fem</button>
            </div>
        </div>
        <div class="actions-group">
            <button class="btn-sync" id="btnSync">Sincronizar WSL</button>
            <button class="btn-reset" id="btnReset">↺ Resetar</button>
        </div>
    </nav>

    <section class="event-details" id="eventBanner"></section>

    <main class="bracket-outer-wrapper">
        <div class="bracket-viewport" id="bracketContainer"></div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        // ESTADO GLOBAL DA APLICAÇÃO (STORE)
        const Store = {
            events: [
                { id: "bells-2026", url: "https://www.worldsurfleague.com/events/2026/ct/438/rip-curl-pro-bells-beach/results", name: "1. Rip Curl Pro Bells Beach", loc: "Bells Beach, Austrália", dates: "01 - 11 Abr, 2026" },
                { id: "margaret-2026", url: "https://www.worldsurfleague.com/events/2026/ct/439/western-australia-margaret-river-pro/results", name: "2. Margaret River Pro", loc: "Margaret River, Austrália", dates: "16 - 26 Abr, 2026" },
                { id: "gold-coast-2026", url: "https://www.worldsurfleague.com/events/2026/ct/440/bonsoy-gold-coast-pro/results", name: "3. Gold Coast Pro", loc: "Snapper Rocks, Austrália", dates: "01 - 11 Mai, 2026" },
                { id: "el-salvador-2026", url: "https://www.worldsurfleague.com/events/2026/ct/442/surf-city-el-salvador-pro/results", name: "4. Surf City El Salvador Pro", loc: "Punta Roca, El Salvador", dates: "05 - 15 Jun, 2026" },
                { id: "rio-2026", url: "https://www.worldsurfleague.com/events/2026/ct/443/vivo-rio-pro/results", name: "5. VIVO Rio Pro", loc: "Saquarema, Brasil", dates: "19 - 27 Jun, 2026" },
                { id: "tahiti-2026", url: "https://www.worldsurfleague.com/events/2026/ct/444/outerknown-tahiti-pro/results", name: "6. Outerknown Tahiti Pro", loc: "Teahupo'o, Taiti", dates: "08 - 18 Ago, 2026" },
                { id: "fiji-2026", url: "https://www.worldsurfleague.com/events/2026/ct/445/fiji-pro/results", name: "7. Corona Fiji Pro", loc: "Cloudbreak, Fiji", dates: "25 Ago - 04 Set, 2026" }
            ],
            currentEventId: "bells-2026",
            category: "masculino",
            stateData: {}
        };

        function createEmptyBracket() {
            const makeHeats = count => Array.from({ length: count }, (_, i) => ({ id: i + 1, p1: 'Aguardando...', p2: 'Aguardando...', winner: null }));
            return {
                masculino: { r1: makeHeats(4), r2: makeHeats(16), r3: makeHeats(8), qf: makeHeats(4), sf: makeHeats(2), final: makeHeats(1), champion: null },
                feminino: { r1: makeHeats(8), r2: makeHeats(8), qf: makeHeats(4), sf: makeHeats(2), final: makeHeats(1), champion: null }
            };
        }

        // GERENCIADOR DE CACHE
        function saveState() {
            localStorage.setItem(`wsl_sim_${Store.currentEventId}`, JSON.stringify(Store.stateData[Store.currentEventId]));
        }

        function loadState() {
            const saved = localStorage.getItem(`wsl_sim_${Store.currentEventId}`);
            if (saved) {
                try {
                    Store.stateData[Store.currentEventId] = JSON.parse(saved);
                    return true;
                } catch(e) {}
            }
            Store.stateData[Store.currentEventId] = createEmptyBracket();
            return false;
        }

        // MOTOR DE CASCATA E PROPAGAÇÃO IMUTÁVEL
        function propagateCascades() {
            const data = Store.stateData[Store.currentEventId][Store.category];
            const getLastName = name => {
                if (!name || name === 'Aguardando...' || name.includes('Vencedor')) return '';
                const parts = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().split(/\s+/);
                return parts[parts.length - 1];
            };

            // Propaga R1 para R2
            if (data.r1) {
                data.r1.forEach((h, i) => {
                    const w = h.winner;
                    const targetIdx = Store.category === 'masculino' ? [8, 5, 2, 12][i] : [4, 0, 2, 6, 1, 7, 3, 5][i];
                    if (data.r2 && data.r2[targetIdx]) {
                        data.r2[targetIdx].p2 = w ? w : `Vencedor R1 H${i+1}`;
                    }
                });
            }

            // Propaga Fases Eliminatórias Encadeadas
            const rounds = Store.category === 'masculino' ? ['r2','r3','qf','sf'] : ['r2','qf','sf'];
            rounds.forEach((rnd, idx) => {
                const nextRnd = ['r3','qf','sf','final'][Store.category === 'feminino' && rnd === 'r2' ? 1 : idx];
                if (!data[rnd] || !data[nextRnd]) return;

                data[rnd].forEach((h, i) => {
                    const targetHeat = data[nextRnd][Math.floor(i / 2)];
                    if (targetHeat) {
                        const slotKey = i % 2 === 0 ? 'p1' : 'p2';
                        targetHeat[slotKey] = h.winner ? h.winner : `Aguardando...`;
                    }
                });
            });

            if (data.final && data.final[0]) {
                data.champion = data.final[0].winner || null;
            }
        }

        // INTEGRAÇÃO DE API COM ALOCAÇÃO ESTRUTURADA
        async function syncWSL() {
            showToast("⏳ Conectando à API WSL...");
            const currentEv = Store.events.find(e => e.id === Store.currentEventId);
            
            try {
                const res = await fetch(`/api-wsl?url=${encodeURIComponent(currentEv.url)}`);
                const json = await res.json();

                if (!json.sucesso || !json.baterias || json.baterias.length === 0) {
                    showToast("⚠️ Baterias não identificadas.");
                    return;
                }

                const catData = Store.stateData[Store.currentEventId][Store.category];
                const flatHeats = [];
                const rounds = Store.category === 'masculino' ? ['r1','r2','r3','qf','sf','final'] : ['r1','r2','qf','sf','final'];
                
                rounds.forEach(r => { if (catData[r]) catData[r].forEach(h => flatHeats.push(h)); });

                // Alocação Estruturada por Ordem de Chaveamento
                let updated = 0;
                const totalToFill = Math.min(json.baterias.length, flatHeats.length);

                for (let i = 0; i < totalToFill; i++) {
                    const ext = json.baterias[i];
                    const sys = flatHeats[i];

                    sys.p1 = ext.p1;
                    sys.p2 = ext.p2;
                    sys.winner = ext.winner ? ext.winner : null;
                    updated++;
                }

                propagateCascades();
                saveState();
                renderUI();
                showToast(`✅ ${updated} baterias sincronizadas com sucesso!`);

            } catch (e) {
                showToast("⚠️ Falha na comunicação com o servidor.");
            }
        }

        // RENDERIZAÇÃO DOM PURA
        function renderUI() {
            const currentEv = Store.events.find(e => e.id === Store.currentEventId);
            document.getElementById('eventBanner').innerHTML = `<h2>${currentEv.name}</h2><p>📍 ${currentEv.loc} | 📅 ${currentEv.dates}</p>`;

            const container = document.getElementById('bracketContainer');
            container.innerHTML = `<svg id="svg-lines-layer"></svg>`;

            const data = Store.stateData[Store.currentEventId][Store.category];
            const isMasc = Store.category === 'masculino';
            const rounds = isMasc ? ['r1','r2','r3','qf','sf'] : ['r1','r2','qf','sf'];
            const titles = isMasc ? ['Round 1','Round 2 (A)','Oitavas (A)','Quartas (A)','Semi (A)'] : ['Round 1','Round 2 (A)','Quartas (A)','Semi (A)'];

            // Lado Esquerdo
            const leftSide = document.createElement('div');
            leftSide.className = 'side-bracket';
            rounds.forEach((r, idx) => {
                if (!data[r]) return;
                const total = data[r].length;
                const half = Math.max(1, Math.floor(total / 2));
                const col = document.createElement('div');
                col.className = 'round-column';
                
                let inner = `<div class="round-header">${titles[idx]}</div><div class="heats-container">`;
                for (let i = 0; i < half; i++) {
                    const h = data[r][i];
                    inner += `
                        <div class="heat-node">
                            <div class="heat-card-wrapper">
                                <div class="heat-card" data-round="${r}" data-heat="${i}">
                                    <div class="heat-title">HEAT ${i + 1}</div>
                                    <div class="surfer-slot ${h.winner === h.p1 ? 'winner':''}" data-slot="1"><span class="surfer-name">${h.p1}</span></div>
                                    <div class="surfer-slot ${h.winner === h.p2 ? 'winner':''}" data-slot="2"><span class="surfer-name">${h.p2}</span></div>
                                </div>
                            </div>
                        </div>`;
                }
                inner += `</div>`;
                col.innerHTML = inner;
                leftSide.appendChild(col);
            });

            // Centro (Final)
            const center = document.createElement('div');
            center.className = 'center-bracket';
            const fh = data.final[0];
            center.innerHTML = `
                <div class="round-header">GRANDE FINAL</div>
                <div class="heat-card-wrapper" style="width:100%;">
                    <div class="heat-card" data-round="final" data-heat="0">
                        <div class="heat-title">FINAL</div>
                        <div class="surfer-slot ${fh.winner === fh.p1 ? 'winner':''}" data-slot="1"><span class="surfer-name">${fh.p1}</span></div>
                        <div class="surfer-slot ${fh.winner === fh.p2 ? 'winner':''}" data-slot="2"><span class="surfer-name">${fh.p2}</span></div>
                    </div>
                </div>
                ${data.champion ? `<div style="margin-top:15px; font-weight:800; color:var(--wsl-accent);">🏆 CAMPEÃO: ${data.champion}</div>` : ''}
            `;

            container.appendChild(leftSide);
            container.appendChild(center);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // EVENT LISTENERS E INICIALIZAÇÃO
        function init() {
            const select = document.getElementById('eventSelect');
            Store.events.forEach(e => select.innerHTML += `<option value="${e.id}">${e.name}</option>`);
            select.value = Store.currentEventId;

            select.addEventListener('change', async e => {
                Store.currentEventId = e.target.value;
                const hasCache = loadState();
                renderUI();
                if (!hasCache) await syncWSL();
            });

            document.getElementById('btnMasc').addEventListener('click', () => {
                Store.category = 'masculino';
                document.getElementById('btnMasc').classList.add('active');
                document.getElementById('btnFem').classList.remove('active');
                renderUI();
            });

            document.getElementById('btnFem').addEventListener('click', () => {
                Store.category = 'feminino';
                document.getElementById('btnFem').classList.add('active');
                document.getElementById('btnMasc').classList.remove('active');
                renderUI();
            });

            document.getElementById('btnSync').addEventListener('click', syncWSL);
            document.getElementById('btnReset').addEventListener('click', () => {
                if (confirm("Resetar palpites da etapa?")) {
                    Store.stateData[Store.currentEventId] = createEmptyBracket();
                    saveState();
                    renderUI();
                }
            });

            document.getElementById('bracketContainer').addEventListener('click', e => {
                const slot = e.target.closest('.surfer-slot');
                if (!slot) return;
                const card = slot.closest('.heat-card');
                const round = card.dataset.round;
                const heatIdx = parseInt(card.dataset.heat);
                const slotIdx = parseInt(slot.dataset.slot);

                const h = Store.stateData[Store.currentEventId][Store.category][round][heatIdx];
                const pickedName = slotIdx === 1 ? h.p1 : h.p2;

                if (!pickedName || pickedName === 'Aguardando...' || pickedName.includes('Vencedor')) return;

                h.winner = pickedName;
                propagateCascades();
                saveState();
                renderUI();
            });

            const hasCache = loadState();
            renderUI();
            if (!hasCache) syncWSL();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
